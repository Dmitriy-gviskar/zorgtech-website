<!DOCTYPE html><html lang="ru" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>404 — Zorgtech</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet">
<style>:root,[data-theme="dark"]{--bg:#000;--tx:#f5f5f7;--tx2:#86868b;--acc:#0071e3}[data-theme="light"]{--bg:#fff;--tx:#1d1d1f;--tx2:#86868b}*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}html{background:var(--bg)}body{font-family:'SF Pro Text','Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:300;font-size:17px;line-height:1.47;letter-spacing:-0.022em;color:var(--tx2);background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.wrap{max-width:400px;padding:40px}.num{font-family:'SF Pro Display','Inter',ui-sans-serif;font-size:96px;font-weight:600;color:var(--tx);letter-spacing:-1.44px;line-height:1;margin-bottom:16px}.sub{font-size:21px;font-weight:400;color:var(--tx2);margin-bottom:32px}.btn{display:inline-flex;padding:14px 32px;font-size:17px;font-weight:400;border-radius:9999px;text-decoration:none;border:none;background:var(--acc);color:#fff;cursor:pointer}.btn:hover{background:#0077ed}
.menu-btn{display:none;width:28px;height:20px;position:fixed;top:12px;right:16px;cursor:pointer;z-index:101;background:none;border:none}.menu-btn span,.menu-btn::before,.menu-btn::after{content:"";position:absolute;left:0;width:100%;height:2px;background:var(--tx);border-radius:1px;transition:all .3s}.menu-btn::before{top:0}.menu-btn span{top:9px}.menu-btn::after{bottom:0}.mobile-nav{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0;pointer-events:none;transition:opacity .4s}.mobile-nav.open{opacity:1;pointer-events:all}.mobile-nav a{font-size:28px;font-weight:300;color:var(--tx);text-decoration:none}.mobile-nav a:hover{color:var(--acc)}@media(max-width:640px){.menu-btn{display:block}.nav-links{display:none}</head><body><div class="wrap"><div class="num">404</div><p class="sub">Страница не найдена</p><a href="index.html" class="btn">На главную</a></div><button class="menu-btn" id="menuBtn" onclick="document.getElementById('mobileNav').classList.toggle('open')"><span></span></button>
</body></html>
